
name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go tests and PostgreSQL integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auction
          POSTGRES_PASSWORD: auction_dev_password
          POSTGRES_DB: auction_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U auction -d auction_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://auction:auction_dev_password@127.0.0.1:5433/auction_db?sslmode=disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check Go formatting
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./... -count=1

      - name: Apply database migrations
        run: |
          docker run --rm \
            --network host \
            -v "$PWD/migrations:/migrations:ro" \
            migrate/migrate:v4.19.1 \
            -path=/migrations \
            -database="$TEST_DATABASE_URL" \
            up

      - name: Check migration version
        run: |
          docker run --rm \
            --network host \
            -v "$PWD/migrations:/migrations:ro" \
            migrate/migrate:v4.19.1 \
            -path=/migrations \
            -database="$TEST_DATABASE_URL" \
            version

      - name: Run PostgreSQL integration tests
        run: |
          go test -tags=integration \
            ./internal/storage \
            -run TestPostgres \
            -v -count=1
      

      - name: Run Redis cache synchronization integration tests
        run: |
          go test -tags=integration \
            ./internal/cache \
            -v -count=1


  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t ad-auction:ci .
